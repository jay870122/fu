<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>外送平台出單系統</title>
    
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 引入 React 和 Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- 引入 Tesseract.js (OCR 文字辨識) -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* 掃描時的動畫 */
        @keyframes scan-line {
            0% { top: 0; }
            50% { top: 100%; }
            100% { top: 0; }
        }
        .animate-scan {
            position: absolute;
            left: 0;
            right: 0;
            height: 2px;
            background: #3b82f6;
            box-shadow: 0 0 4px #3b82f6;
            animation: scan-line 2s linear infinite;
        }

        /* 列印專用樣式 */
        @media print {
            @page { margin: 0; size: auto; }
            body * { visibility: hidden; }
            #printable-receipt, #printable-receipt * { visibility: visible; }
            #printable-receipt { 
                position: absolute; 
                left: 0; 
                right: 0; 
                top: 0; 
                width: 57mm; 
                margin: 0 auto; 
                padding: 0; 
            }
            
            .receipt-copy {
                page-break-after: always;
                page-break-inside: avoid;
                padding-bottom: 2mm;
                margin-bottom: 2mm;
                display: block;
                position: relative;
            }
            
            .receipt-copy:last-child {
                page-break-after: auto;
                border-bottom: none;
            }

            .cut-line {
                display: flex;
                align-items: center;
                justify-content: center;
                margin: 10px 0;
                color: #000;
                font-size: 12px;
                font-weight: bold;
            }
            .cut-line::before, .cut-line::after {
                content: '';
                flex: 1;
                border-bottom: 2px dashed #000;
                margin: 0 5px;
            }
        }
    </style>
</head>
<body class="bg-gray-100 touch-manipulation">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- 圖示元件 ---
        const IconBase = ({ size = 24, className = "", children }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
        );
        const Printer = (props) => (<IconBase {...props}><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14"/></IconBase>);
        const ShoppingBag = (props) => (<IconBase {...props}><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></IconBase>);
        const Plus = (props) => (<IconBase {...props}><path d="M5 12h14"/><path d="M12 5v14"/></IconBase>);
        const Minus = (props) => (<IconBase {...props}><path d="M5 12h14"/></IconBase>);
        const RotateCcw = (props) => (<IconBase {...props}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 12"/><path d="M3 3v9h9"/></IconBase>);
        const Smartphone = (props) => (<IconBase {...props}><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></IconBase>);
        const Layers = (props) => (<IconBase {...props}><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></IconBase>);
        const Settings = (props) => (<IconBase {...props}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></IconBase>);
        const Camera = (props) => (<IconBase {...props}><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></IconBase>);
        const Loader = (props) => (<IconBase {...props} className="animate-spin"><path d="M21 12a9 9 0 1 1-6.219-8.56" /></IconBase>);

        // --- 自定義 Hook: 自動儲存狀態到 LocalStorage ---
        const useStickyState = (key, defaultValue) => {
            const [value, setValue] = useState(() => {
                const stickyValue = window.localStorage.getItem(key);
                return stickyValue !== null ? JSON.parse(stickyValue) : defaultValue;
            });
            useEffect(() => {
                window.localStorage.setItem(key, JSON.stringify(value));
            }, [key, value]);
            return [value, setValue];
        };

        // --- 主程式 ---
        const ReceiptApp = () => {
            const [platform, setPlatform] = useStickyState('app_platform', 'uber');
            const [orderId, setOrderId] = useStickyState('app_orderId', '');
            const [items, setItems] = useStickyState('app_items', []);
            const [printMode, setPrintMode] = useStickyState('app_printMode', 'passprnt'); 
            const [copyCount, setCopyCount] = useStickyState('app_copyCount', 1);

            const [currentItem, setCurrentItem] = useState('');
            const [currentPrice, setCurrentPrice] = useState('');
            const [showSettings, setShowSettings] = useState(false);
            
            // 掃描相關狀態
            const [isScanning, setIsScanning] = useState(false);
            const fileInputRef = useRef(null);

            const styles = {
                uber: { primary: 'bg-green-600', text: 'text-green-700', logoText: 'UBER', logoSuffix: 'EATS' },
                panda: { primary: 'bg-pink-600', text: 'text-pink-600', logoText: 'FOOD', logoSuffix: 'PANDA' }
            };
            const currentStyle = styles[platform];

            const addItem = () => {
                if (!currentItem) return;
                setItems([...items, { id: Date.now(), name: currentItem, price: Number(currentPrice) || 0 }]);
                setCurrentItem(''); setCurrentPrice('');
            };

            const total = items.reduce((sum, item) => sum + item.price, 0);
            
            const clearAll = () => { 
                if(confirm('確定要清除所有資料嗎？')) {
                    setItems([]); 
                    setOrderId(''); 
                }
            };

            const getCurrentTime = () => { const now = new Date(); return `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`; };
            const getCurrentDate = () => { const now = new Date(); return `${now.getMonth() + 1}/${now.getDate()}`; };

            // --- OCR 掃描邏輯 ---
            const handleScanClick = () => {
                if (fileInputRef.current) {
                    fileInputRef.current.click();
                }
            };

            const handleFileChange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                setIsScanning(true);
                try {
                    // 使用 Tesseract.js 進行辨識
                    const result = await Tesseract.recognize(
                        file,
                        'eng', // 使用英文模型即可，因為單號通常是英文數字
                        { 
                            logger: m => console.log(m) // 開發時可在 Console 看進度
                        }
                    );

                    const text = result.data.text;
                    console.log("OCR Result:", text);

                    // --- 智慧解析單號邏輯 ---
                    // 策略 1: 尋找 # 符號後面的內容 (Foodpanda 常見格式: #123)
                    const hashMatch = text.match(/#\s*([a-zA-Z0-9]+)/);
                    
                    // 策略 2: 尋找 Uber 常見的格式 (如 8A123, 5位英數混合)
                    const uberMatch = text.match(/\b[A-Z0-9]{5}\b/);
                    
                    // 策略 3: 尋找獨立的3-4位數字
                    const digitMatch = text.match(/\b\d{3,4}\b/);

                    let foundId = '';

                    if (hashMatch && hashMatch[1]) {
                        foundId = hashMatch[1];
                    } else if (uberMatch) {
                        foundId = uberMatch[0];
                    } else if (digitMatch) {
                        foundId = digitMatch[0];
                    }

                    if (foundId) {
                        // 移除雜訊，轉大寫
                        setOrderId(foundId.toUpperCase());
                        alert(`成功辨識單號: ${foundId}`);
                    } else {
                        alert('無法辨識明確的單號，請手動輸入。\n(建議將畫面中的單號拍大一點)');
                    }

                } catch (error) {
                    console.error(error);
                    alert('辨識發生錯誤，請重試。');
                } finally {
                    setIsScanning(false);
                    // 清空 input 讓下次能選同一張圖
                    e.target.value = ''; 
                }
            };

            // --- Star PassPRNT 協議產生器 ---
            const handlePassPrnt = () => {
                if (!orderId) { alert("請輸入單號"); return; }
                const getSingleReceiptHtml = (isLast) => `
                    <div style="width: 100%; max-width: 57mm; margin: 0 auto; text-align: center; font-family: sans-serif; padding-bottom: 5px;">
                        <div style="font-size: 40px; font-weight: 900; line-height: 1.1; margin-bottom: 5px;">
                            ${currentStyle.logoText}<br/>${currentStyle.logoSuffix}
                        </div>
                        <div style="font-size: 80px; font-weight: 900; line-height: 1;">#${orderId}</div>
                        <div style="font-size: 14px; margin-top: 5px; padding-top: 5px;">
                            ${getCurrentDate()} ${getCurrentTime()}
                        </div>
                        ${!isLast ? `
                        <div style="margin-top: 15px; display: flex; align-items: center; justify-content: center; font-size: 20px;">
                            <span style="border-bottom: 2px dashed #000; flex: 1;"></span>
                            <span style="margin: 0 10px;">✂️</span>
                            <span style="border-bottom: 2px dashed #000; flex: 1;"></span>
                        </div>
                        ` : ''}
                    </div>
                `;
                let fullHtmlBody = '';
                for(let i=0; i<copyCount; i++) {
                    fullHtmlBody += getSingleReceiptHtml(i === copyCount - 1);
                }
                const htmlContent = `
                    <html><head><meta name="viewport" content="width=device-width, initial-scale=1.0"></head>
                    <body style="margin: 0; padding: 0;">${fullHtmlBody}</body></html>
                `;
                const passPrntUrl = `starpassprnt://v1/print/nopreview?back=${encodeURIComponent(window.location.href)}&html=${encodeURIComponent(htmlContent)}&drawer=off&size=2&cut=partial`;
                window.location.href = passPrntUrl;
            };

            const handlePrint = () => {
                if (printMode === 'passprnt') handlePassPrnt();
                else window.print();
            };

            return (
                <div className="min-h-screen bg-gray-100 flex flex-col font-sans">
                    {/* 隱藏的檔案輸入框 */}
                    <input 
                        type="file" 
                        accept="image/*" 
                        capture="environment" 
                        ref={fileInputRef} 
                        onChange={handleFileChange} 
                        className="hidden" 
                    />

                    {/* 遮罩層 (掃描中) */}
                    {isScanning && (
                        <div className="fixed inset-0 bg-black/70 z-[60] flex flex-col items-center justify-center text-white">
                            <div className="relative w-64 h-64 border-2 border-white/50 rounded-lg overflow-hidden mb-4 bg-gray-800">
                                <div className="animate-scan"></div>
                                <div className="absolute inset-0 flex items-center justify-center">
                                    <Loader size={48} />
                                </div>
                            </div>
                            <p className="font-bold text-xl animate-pulse">正在讀取單號...</p>
                            <p className="text-sm text-gray-400 mt-2">首次使用可能需要幾秒鐘載入模型</p>
                        </div>
                    )}

                    {/* 頂部 */}
                    <div className={`p-4 shadow-md text-white flex justify-between items-center print:hidden ${currentStyle.primary} transition-colors duration-300`}>
                        <div className="flex items-center space-x-2 font-bold text-xl">
                            <ShoppingBag /><span>極簡出單</span>
                        </div>
                        <button onClick={() => setShowSettings(!showSettings)} className="p-2 rounded hover:bg-white/20"><Settings size={20} /></button>
                    </div>

                    {/* 設定面板 */}
                    {showSettings && (
                        <div className="bg-white p-4 border-b print:hidden space-y-4 animate-in slide-in-from-top-2">
                            <h3 className="font-bold text-gray-700">進階設定</h3>
                            <div className="space-y-2">
                                <label className="flex items-center space-x-3 p-3 border rounded-lg cursor-pointer hover:bg-gray-50">
                                    <input type="radio" name="mode" checked={printMode === 'passprnt'} onChange={() => setPrintMode('passprnt')} className="w-5 h-5 text-blue-600" />
                                    <div>
                                        <div className="font-bold text-gray-800">PassPRNT App (推薦)</div>
                                        <div className="text-xs text-gray-500">印表機最後會自動切紙。</div>
                                    </div>
                                </label>
                                <label className="flex items-center space-x-3 p-3 border rounded-lg cursor-pointer hover:bg-gray-50">
                                    <input type="radio" name="mode" checked={printMode === 'browser'} onChange={() => setPrintMode('browser')} className="w-5 h-5 text-blue-600" />
                                    <div>
                                        <div className="font-bold text-gray-800">系統列印 (System Print)</div>
                                        <div className="text-xs text-gray-500">使用瀏覽器內建列印功能。</div>
                                    </div>
                                </label>
                            </div>
                            <button onClick={() => setShowSettings(false)} className="w-full bg-gray-200 py-2 rounded text-gray-600">關閉</button>
                        </div>
                    )}

                    {/* 主內容 */}
                    <div className="flex-1 p-4 pb-24 overflow-y-auto print:hidden">
                        {/* 平台切換 */}
                        <div className="flex rounded-lg overflow-hidden border-2 border-gray-200 mb-6 bg-white">
                            <button onClick={() => setPlatform('uber')} className={`flex-1 py-3 font-bold flex items-center justify-center gap-2 ${platform === 'uber' ? 'bg-green-600 text-white' : 'text-gray-500'}`}>Uber Eats</button>
                            <button onClick={() => setPlatform('panda')} className={`flex-1 py-3 font-bold flex items-center justify-center gap-2 ${platform === 'panda' ? 'bg-pink-600 text-white' : 'text-gray-500'}`}>foodpanda</button>
                        </div>

                        {/* 單號輸入 (包含相機按鈕) */}
                        <div className="bg-white p-6 rounded-xl shadow-sm mb-4">
                            <label className="text-gray-500 text-lg font-bold block mb-2 text-center">請輸入或掃描訂單編號</label>
                            <div className="relative flex items-center justify-center border-b-4 border-gray-200 focus-within:border-blue-500 pb-2">
                                <span className="text-4xl font-bold text-gray-400 mr-2">#</span>
                                <input 
                                    type="text" 
                                    value={orderId} 
                                    onChange={(e) => setOrderId(e.target.value)} 
                                    placeholder="123" 
                                    className="w-full text-center text-6xl font-black p-2 outline-none text-gray-800 uppercase" 
                                />
                                {/* 相機按鈕 */}
                                <button 
                                    onClick={handleScanClick}
                                    className="absolute right-0 top-1/2 -translate-y-1/2 p-3 bg-blue-100 text-blue-600 rounded-full hover:bg-blue-200 transition-colors"
                                    title="拍單號"
                                >
                                    <Camera size={28} />
                                </button>
                            </div>
                            <p className="text-center text-xs text-gray-400 mt-2">點擊相機圖示可直接拍平板上的單號 (#123)</p>
                        </div>

                        {/* 份數設定 */}
                        <div className="bg-white p-4 rounded-xl shadow-sm mb-4 flex items-center justify-between">
                             <div className="flex items-center gap-2 font-bold text-gray-600">
                                <Layers size={20}/>
                                <span>列印份數</span>
                             </div>
                             <div className="flex items-center gap-3">
                                <button onClick={() => setCopyCount(Math.max(1, copyCount - 1))} className="w-12 h-12 rounded-full bg-gray-100 border-2 border-gray-200 flex items-center justify-center text-gray-600 active:bg-gray-200"><Minus size={20} /></button>
                                <span className="text-3xl font-black w-10 text-center">{copyCount}</span>
                                <button onClick={() => setCopyCount(copyCount + 1)} className="w-12 h-12 rounded-full bg-blue-500 border-2 border-blue-600 flex items-center justify-center text-white active:bg-blue-600"><Plus size={20} /></button>
                            </div>
                        </div>

                        {/* 計算機 */}
                        <div className="bg-gray-50 p-4 rounded-xl border border-dashed border-gray-300">
                            <p className="text-center text-gray-400 text-sm mb-2">簡易計算 (不列印)</p>
                            <div className="flex gap-2 mb-2">
                                <input type="text" value={currentItem} onChange={e=>setCurrentItem(e.target.value)} placeholder="品項" className="flex-1 p-2 rounded border" />
                                <input type="number" value={currentPrice} onChange={e=>setCurrentPrice(e.target.value)} placeholder="$" className="w-20 p-2 rounded border" />
                                <button onClick={addItem} className="bg-gray-200 p-2 rounded"><Plus size={20}/></button>
                            </div>
                            {items.length > 0 && <div className="text-right font-bold text-gray-600">總計: ${total}</div>}
                        </div>
                    </div>

                    {/* 底部按鈕 */}
                    <div className="fixed bottom-0 left-0 right-0 bg-white border-t p-4 flex gap-3 print:hidden shadow-lg z-50">
                        <button onClick={clearAll} className="px-6 py-3 rounded-xl border-2 border-gray-200 text-gray-500 font-bold flex flex-col items-center justify-center text-xs">
                            <RotateCcw size={20} className="mb-1" />清除
                        </button>
                        <button onClick={handlePrint} className={`flex-1 rounded-xl font-bold text-white text-2xl shadow-lg flex items-center justify-center gap-2 active:scale-95 transition-transform ${currentStyle.primary}`}>
                            <div className="flex flex-col items-center leading-none">
                                <div className="flex items-center gap-2">
                                    {printMode === 'passprnt' ? <Smartphone size={24} /> : <Printer size={24} />}
                                    <span>{printMode === 'passprnt' ? 'App 出單' : '列印單號'}</span>
                                </div>
                                {copyCount > 1 && <span className="text-xs opacity-90 mt-1 bg-black/20 px-2 rounded-full">印 {copyCount} 張</span>}
                            </div>
                        </button>
                    </div>

                    {/* 瀏覽器列印專用區 */}
                    <div id="printable-receipt" className="hidden font-sans text-black leading-none w-[57mm] mx-auto text-center">
                        {Array.from({ length: copyCount }).map((_, index) => (
                            <div key={index} className="receipt-copy">
                                <div className="mb-2">
                                    <h1 className="text-4xl font-black uppercase leading-tight">{currentStyle.logoText}<br/>{currentStyle.logoSuffix}</h1>
                                </div>
                                <div className="mb-2">
                                    <p className="text-[6rem] font-black leading-none">#{orderId || '---'}</p>
                                </div>
                                <div className="text-[14px] font-bold text-gray-600 border-t-2 border-black pt-2 mx-2">
                                    {getCurrentDate()} {getCurrentTime()}
                                </div>
                                {index < copyCount - 1 && <div className="cut-line mt-4">✂️</div>}
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ReceiptApp />);
    </script>
</body>
</html>
