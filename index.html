<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>外送平台出單系統</title>
    
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 引入 React 和 Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* 隱藏滾動條但保留功能 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* 列印時的樣式強制覆蓋 */
        @media print {
            @page {
                margin: 0;
                size: auto;
            }
            body * {
                visibility: hidden;
            }
            #printable-receipt, #printable-receipt * {
                visibility: visible;
            }
            #printable-receipt {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                padding: 2mm 0;
            }
        }
    </style>
</head>
<body class="bg-gray-100 touch-manipulation">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- 圖示元件 (SVG) ---
        const IconBase = ({ size = 24, className = "", children }) => (
            <svg 
                xmlns="http://www.w3.org/2000/svg" 
                width={size} 
                height={size} 
                viewBox="0 0 24 24" 
                fill="none" 
                stroke="currentColor" 
                strokeWidth="2" 
                strokeLinecap="round" 
                strokeLinejoin="round" 
                className={className}
            >
                {children}
            </svg>
        );

        const Printer = (props) => (
            <IconBase {...props}>
                <polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14"/>
            </IconBase>
        );

        const ShoppingBag = (props) => (
            <IconBase {...props}>
                <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/>
            </IconBase>
        );

        const Plus = (props) => (
            <IconBase {...props}>
                <path d="M5 12h14"/><path d="M12 5v14"/>
            </IconBase>
        );

        const RotateCcw = (props) => (
            <IconBase {...props}>
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 12"/><path d="M3 3v9h9"/>
            </IconBase>
        );
        
        const Wifi = (props) => (
            <IconBase {...props}>
                <path d="M5 12.55a11 11 0 0 1 14.08 0"></path><path d="M1.42 9a16 16 0 0 1 21.16 0"></path><path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path><line x1="12" y1="20" x2="12.01" y2="20"></line>
            </IconBase>
        );

        // --- 主程式邏輯 ---
        const ReceiptApp = () => {
            const [platform, setPlatform] = useState('uber');
            const [orderId, setOrderId] = useState('');
            const [items, setItems] = useState([]);
            const [currentItem, setCurrentItem] = useState('');
            const [currentPrice, setCurrentPrice] = useState('');
            const [currentQty, setCurrentQty] = useState(1);
            
            // IP 列印相關設定
            const [printerIp, setPrinterIp] = useState('192.168.1.100');
            const [useIpPrint, setUseIpPrint] = useState(false);
            const [showSettings, setShowSettings] = useState(false);
            const [isPrinting, setIsPrinting] = useState(false);

            const styles = {
                uber: {
                    primary: 'bg-green-600',
                    text: 'text-green-700',
                    border: 'border-green-600',
                    bgLight: 'bg-green-50',
                    name: 'Uber Eats',
                    logoText: 'Uber',
                    logoSuffix: 'Eats'
                },
                panda: {
                    primary: 'bg-pink-600',
                    text: 'text-pink-600',
                    border: 'border-pink-600',
                    bgLight: 'bg-pink-50',
                    name: 'foodpanda',
                    logoText: 'food',
                    logoSuffix: 'panda'
                }
            };

            const currentStyle = styles[platform];

            const addItem = () => {
                if (!currentItem) return;
                const newItem = {
                    id: Date.now(),
                    name: currentItem,
                    price: Number(currentPrice) || 0,
                    qty: Number(currentQty) || 1
                };
                setItems([...items, newItem]);
                setCurrentItem('');
                setCurrentPrice('');
                setCurrentQty(1);
            };

            const total = items.reduce((sum, item) => sum + (item.price * item.qty), 0);

            const clearAll = () => {
                setItems([]);
                setOrderId('');
            };

            const getCurrentTime = () => {
                const now = new Date();
                return `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
            };

            const getCurrentDate = () => {
                const now = new Date();
                return `${now.getMonth() + 1}/${now.getDate()}`;
            };

            // --- Star WebPRNT 列印邏輯 ---
            const sendToPrinter = async (isTest = false) => {
                setIsPrinting(true);
                
                // 決定列印內容
                const printPlatform = isTest ? 'TEST PRINT' : (platform === 'uber' ? 'Uber Eats' : 'foodpanda');
                const printId = isTest ? '888' : (orderId || '---');
                const printTime = `${getCurrentDate()} ${getCurrentTime()}`;

                // 建構 XML 指令 (Star WebPRNT 格式)
                const xmlBody = `
<StarWebPRNT xmlns="http://www.star-m.jp/onwebprnt/bin/starwebprnt" xmlns:i="http://www.w3.org/2001/XMLSchema-instance">
    <Request>
        <Bo/>
        <Text width="1" height="1" font="font_a" align="center" smooth="true">${printPlatform}\n</Text>
        <Text width="3" height="3" font="font_b" align="center" smooth="true">#${printId}\n</Text>
        <Text align="center">${printTime}\n</Text>
        <Cut paper="partial"/>
    </Request>
</StarWebPRNT>`;

                try {
                    // 發送請求到印表機
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 5000); // 5秒超時

                    // Star mC-Print3 通常預設為 http://[IP]/StarWebPRNT/SendMessage
                    const response = await fetch(`http://${printerIp}/StarWebPRNT/SendMessage`, {
                        method: 'POST',
                        body: xmlBody,
                        headers: { 'Content-Type': 'text/xml' },
                        signal: controller.signal
                    });
                    
                    clearTimeout(timeoutId);

                    if (response.ok) {
                        if (isTest) alert('測試指令已發送！\n若印表機無反應，請檢查紙張或連線。');
                    } else {
                        throw new Error('印表機回應錯誤 (Status: ' + response.status + ')');
                    }
                } catch (e) {
                    console.error(e);
                    alert(`列印失敗：${e.message}\n\n故障排除：\n1. 確認手機連上店內 WiFi\n2. 確認 IP 正確\n3. 這是 HTTP 請求，若網頁為 HTTPS 可能被瀏覽器阻擋 (Mixed Content)`);
                } finally {
                    setIsPrinting(false);
                }
            };

            // 統一列印處理
            const handlePrint = () => {
                if (useIpPrint) {
                    sendToPrinter(false);
                } else {
                    window.print();
                }
            };

            return (
                <div className="min-h-screen bg-gray-100 flex flex-col font-sans">
                    {/* 頂部導航欄 */}
                    <div className={`p-4 shadow-md text-white flex justify-between items-center print:hidden ${currentStyle.primary} transition-colors duration-300`}>
                        <div className="flex items-center space-x-2 font-bold text-xl">
                            <ShoppingBag />
                            <span>極簡出單</span>
                        </div>
                        <button onClick={() => setShowSettings(!showSettings)} className="p-2 rounded hover:bg-white/20">
                            <Printer size={20} />
                        </button>
                    </div>

                    {/* 設定面板 */}
                    {showSettings && (
                        <div className="bg-white p-4 border-b print:hidden animate-in slide-in-from-top-2 space-y-3">
                            <div className="flex justify-between items-center">
                                <h3 className="font-bold text-gray-700 flex items-center gap-2">
                                    <Printer size={16} /> 印表機設定 (Star mC-Print3)
                                </h3>
                                <button onClick={() => setShowSettings(false)} className="text-gray-400 hover:text-gray-600">
                                    ✕
                                </button>
                            </div>
                            
                            {/* IP 輸入與開關 */}
                            <div className="space-y-2">
                                <div className="flex items-center justify-between bg-gray-50 p-2 rounded border">
                                    <span className="text-sm font-bold text-gray-600">啟用 IP 直接列印</span>
                                    <button 
                                        onClick={() => setUseIpPrint(!useIpPrint)}
                                        className={`w-12 h-6 rounded-full transition-colors relative ${useIpPrint ? 'bg-blue-500' : 'bg-gray-300'}`}
                                    >
                                        <div className={`w-5 h-5 bg-white rounded-full absolute top-0.5 transition-transform ${useIpPrint ? 'left-[26px]' : 'left-0.5'}`} />
                                    </button>
                                </div>

                                {useIpPrint && (
                                    <div className="animate-in fade-in slide-in-from-top-1">
                                        <div className="flex gap-2">
                                            <input 
                                                type="text" 
                                                value={printerIp}
                                                onChange={(e) => setPrinterIp(e.target.value)}
                                                placeholder="輸入印表機 IP (如 192.168.1.100)"
                                                className="flex-1 p-2 border rounded text-sm font-mono"
                                            />
                                            <button 
                                                onClick={() => sendToPrinter(true)}
                                                disabled={isPrinting}
                                                className="bg-gray-600 text-white px-3 rounded text-sm whitespace-nowrap active:bg-gray-700 disabled:opacity-50"
                                            >
                                                {isPrinting ? '...' : '測試'}
                                            </button>
                                        </div>
                                        <p className="text-xs text-orange-500 mt-1">
                                            ⚠️ 注意：IP 列印需在同網域內。若無反應，請暫時使用「瀏覽器列印」功能。
                                        </p>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* 主內容 */}
                    <div className="flex-1 p-4 pb-24 overflow-y-auto print:hidden">
                        {/* 平台選擇 */}
                        <div className="flex rounded-lg overflow-hidden border-2 border-gray-200 mb-6 bg-white">
                            <button 
                                onClick={() => setPlatform('uber')}
                                className={`flex-1 py-3 font-bold flex items-center justify-center gap-2 ${platform === 'uber' ? 'bg-green-600 text-white' : 'text-gray-500 hover:bg-gray-50'}`}
                            >
                                Uber Eats
                            </button>
                            <button 
                                onClick={() => setPlatform('panda')}
                                className={`flex-1 py-3 font-bold flex items-center justify-center gap-2 ${platform === 'panda' ? 'bg-pink-600 text-white' : 'text-gray-500 hover:bg-gray-50'}`}
                            >
                                foodpanda
                            </button>
                        </div>

                        {/* 單號輸入 (特大) */}
                        <div className="bg-white p-6 rounded-xl shadow-sm mb-4">
                            <label className="text-gray-500 text-lg font-bold block mb-2 text-center">請輸入訂單編號</label>
                            <div className="flex items-center justify-center border-b-4 border-gray-200 focus-within:border-blue-500">
                                <span className="text-4xl font-bold text-gray-400 mr-2">#</span>
                                <input 
                                    type="text" 
                                    value={orderId}
                                    onChange={(e) => setOrderId(e.target.value)}
                                    placeholder="123"
                                    className="w-full text-center text-6xl font-black p-2 outline-none text-gray-800"
                                />
                            </div>
                        </div>

                        {/* 簡易計算機 */}
                        <div className="bg-gray-50 p-4 rounded-xl border border-dashed border-gray-300">
                            <p className="text-center text-gray-400 text-sm mb-2">餐點計算機 (僅手機顯示)</p>
                            <div className="flex gap-2 mb-2">
                                <input type="text" value={currentItem} onChange={e=>setCurrentItem(e.target.value)} placeholder="品項" className="flex-1 p-2 rounded border" />
                                <input type="number" value={currentPrice} onChange={e=>setCurrentPrice(e.target.value)} placeholder="$" className="w-20 p-2 rounded border" />
                                <button onClick={addItem} className="bg-gray-200 p-2 rounded"><Plus size={20}/></button>
                            </div>
                            {items.length > 0 && (
                                <div className="text-right font-bold text-gray-600">總計: ${total}</div>
                            )}
                        </div>
                    </div>

                    {/* 底部操作欄 */}
                    <div className="fixed bottom-0 left-0 right-0 bg-white border-t p-4 flex gap-3 print:hidden shadow-lg z-50">
                        <button 
                            onClick={clearAll}
                            className="px-6 py-3 rounded-xl border-2 border-gray-200 text-gray-500 font-bold flex flex-col items-center justify-center text-xs"
                        >
                            <RotateCcw size={20} className="mb-1" />
                            清除
                        </button>
                        <button 
                            onClick={handlePrint}
                            disabled={isPrinting}
                            className={`flex-1 rounded-xl font-bold text-white text-2xl shadow-lg flex items-center justify-center gap-2 active:scale-95 transition-transform disabled:opacity-70 ${currentStyle.primary}`}
                        >
                            {isPrinting ? (
                                <span>連線中...</span>
                            ) : (
                                <>
                                    {useIpPrint ? <Wifi size={32} /> : <Printer size={32} />}
                                    <span>{useIpPrint ? 'IP 出單' : '列印單號'}</span>
                                </>
                            )}
                        </button>
                    </div>

                    {/* 列印區域 (Print Only - 用於瀏覽器列印) */}
                    <div id="printable-receipt" className="hidden font-sans text-black leading-none max-w-[80mm] mx-auto text-center">
                        <div className="mb-1">
                            <h1 className="text-xl font-bold uppercase tracking-wider">
                                {currentStyle.logoText}{currentStyle.logoSuffix}
                            </h1>
                        </div>
                        <div className="mb-1">
                            <p className="text-[6rem] font-black leading-none tracking-tighter">
                                #{orderId || '---'}
                            </p>
                        </div>
                        <div className="text-[10px] font-bold text-gray-600 border-t border-black pt-1 mx-4">
                            {getCurrentDate()} {getCurrentTime()}
                        </div>
                        <div className="h-4"></div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ReceiptApp />);
    </script>
</body>
</html>
